<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0a0e" />
    <title>CorpSol</title>
    <!-- Скрипт Telegram подключается до приложения: он создаёт window.Telegram.WebApp. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!--
      Тема — до первого кадра: иначе светлая тема мигает тёмной заставкой.
      Та же логика, что applyAppearance в src/theme.ts, без зависимостей.
    -->
    <script>
      try {
        var saved = JSON.parse(localStorage.getItem('corpsol.appearance') || '{}');
        var app = window.Telegram && window.Telegram.WebApp;
        var system = app && app.initData ? app.colorScheme : 'dark';
        var theme = !saved.theme || saved.theme === 'system' ? system : saved.theme;
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.accent = saved.accent || 'brand';
      } catch (error) {}
    </script>
    <!-- Соединение с сервером открывается, пока грузятся скрипты. -->
    <link rel="preconnect" href="__API_ORIGIN__" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Иконки — тот же набор Material, что во Flutter-приложении, но только
      нужные: icon_names урезает шрифт с 320 КБ до 12. Новую иконку надо
      дописать в список, иначе вместо неё покажется её название.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400..500,0..1,0&icon_names=account_balance_wallet,arrow_forward,call,call_made,call_missed_outgoing,call_received,check,check_circle,cloud_off,error,handshake,headset_mic,home,inbox,insights,location_searching,logout,payments,person,phonelink_lock,qr_code_scanner,visibility,visibility_off&display=block"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="ambient"></div>
    <!-- Заставка до загрузки скриптов; React заменит её той же разметкой. -->
    <div id="root">
      <div class="splash">
        <div class="splash-mark">C</div>
        <div class="splash-name">CorpSol</div>
        <div class="splash-bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
