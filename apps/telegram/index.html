<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0a0e" />
    <title>CorpSol</title>
    <!-- Скрипт Telegram подключается до приложения: он создаёт window.Telegram.WebApp. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Иконки — тот же набор Material, что во Flutter-приложении. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="ambient"></div>
    <!-- Заставка до загрузки скриптов; React заменит её той же разметкой. -->
    <div id="root">
      <div class="splash">
        <div class="splash-mark">C</div>
        <div class="splash-name">CorpSol</div>
        <div class="splash-bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
