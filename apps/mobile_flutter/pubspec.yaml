name: corpsol_mobile
description: Приложение менеджера CorpSol — отметка прихода, зарплата, офферы, рейтинг.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # Вход сотрудника. Сессия переживает перезапуск приложения.
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3

  # Скан QR с экрана терминала.
  mobile_scanner: ^7.4.2

  # Координаты для геозоны. На Android сообщает о подмене положения.
  geolocator: ^13.0.2

  # Идентификатор устройства переживает переустановку приложения.
  flutter_secure_storage: ^9.2.2
  device_info_plus: ^11.1.1
  package_info_plus: ^8.1.1
  crypto: ^3.0.6

  http: ^1.2.2
  provider: ^6.1.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
