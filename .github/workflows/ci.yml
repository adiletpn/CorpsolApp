name: Проверки

on:
  push:
    branches: [main]
  pull_request:

# Новый пуш в ту же ветку отменяет предыдущий прогон: при наших двадцати
# коммитах в день очередь иначе забивается заведомо устаревшими проверками.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Бэкенд и панель
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ci, а не install: ставит ровно то, что записано в package-lock.json.
      - run: npm ci

      # Бэкенд и панель импортируют @corpsol/shared собранным,
      # поэтому проверка типов без этого шага падает на каждом импорте.
      - run: npm run build:shared

      - run: npm run typecheck

      # Тесты идут без эмулятора Firebase: Java в CI не нужна.
      - run: npm test

  flutter:
    name: Приложение МОПа
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile_flutter
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      - run: flutter pub get

      # Форматирование проверяем здесь, чтобы не спорить о нём в обзорах.
      - run: dart format --output=none --set-exit-if-changed .

      - run: flutter analyze

      - run: flutter test
