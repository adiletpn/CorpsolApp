name: Проверки

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ci, а не install: ставит ровно то, что записано в package-lock.json.
      - run: npm ci

      # Бэкенд и панель импортируют @corpsol/shared собранным,
      # поэтому проверка типов без этого шага падает на каждом импорте.
      - run: npm run build:shared
