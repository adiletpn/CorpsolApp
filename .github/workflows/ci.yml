name: Проверки

on:
  push:
    branches: [main]
  pull_request:

# Новый пуш в ту же ветку отменяет предыдущий прогон: при наших двадцати
# коммитах в день очередь иначе забивается заведомо устаревшими проверками.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Бэкенд и панель
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ci, а не install: ставит ровно то, что записано в package-lock.json.
      - run: npm ci

      # Бэкенд и панель импортируют @corpsol/shared собранным,
      # поэтому проверка типов без этого шага падает на каждом импорте.
      - run: npm run build:shared

      - run: npm run typecheck

      # Тесты бэкенда и панели одной командой: панель долго оставалась
      # без проверок, и отдельный шаг снова забыли бы добавить.
      # Эмулятор Firebase не нужен, Java в CI тоже.
      - run: npm test

  flutter:
    name: Приложение МОПа
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile_flutter
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      - run: flutter pub get

      # Форматирование проверяем здесь, чтобы не спорить о нём в обзорах.
      - run: dart format --output=none --set-exit-if-changed .

      - run: flutter analyze

      - run: flutter test

  images:
    name: Сборка образов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Образы только собираются, никуда не публикуются: задача шага —
      # поймать поломку Dockerfile до развёртывания.
      - name: Бэкенд
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Панель
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:3001/api
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=corpsol-local

      # Мини-апп для Telegram — статика за nginx. Адрес сервера в сборке
      # условный: проверяется сама сборка, а не связь с бэкендом.
      - name: Мини-апп
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/telegram/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=http://localhost:3001/api
            VITE_FIREBASE_PROJECT_ID=corpsol-local
